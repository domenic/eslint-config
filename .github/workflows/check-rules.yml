name: Check ESLint Rules Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: latest

      - run: npm ci

      - name: Check core ESLint rules
        run: npm run check-rules

      - name: Check @stylistic rules
        run: npm run check-rules:stylistic

      - name: Check formatting
        run: npm run format:check
